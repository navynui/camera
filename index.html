<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <title>Camera</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="180" />
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Camera%22%2C%22short_name%22%3A%22Camera%22%2C%22description%22%3A%22Mobile-first%20camera%20recording%20viewer%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22orientation%22%3A%22any%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.svg%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%22%7D%5D%7D">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
  <link href="style.css?v=mobile_v11" rel="stylesheet" />
  <script type="text/javascript" src="script.js?v=mobile_v11"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>

<body class="has-navbar-fixed-top" onload="loaddata()">
  <nav id="navigate" class="navbar is-fixed-top is-dark px-4" role="navigation" aria-label="main navigation"></nav>

  <section class="section media-container">
    <div class="container is-fluid">
      <div id="main" class="columns is-multiline is-centered is-variable is-1-mobile is-2-tablet"></div>
    </div>
  </section>

  <div id="videoModal" class="modal">
    <div class="modal-background" onclick="closeVideoModal()"></div>
    <div class="modal-content">
      <div class="video-container">
        <video id="videoPlayer" playsinline>
          <source src="" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="video-controls">
          <button class="control-btn" id="playPauseBtn" onclick="togglePlay()">
            <span id="playIcon">&#9658;</span>
          </button>
          <div class="progress-container">
            <input type="range" id="progressBar" value="0" min="0" step="0.1" oninput="seekVideo()">
          </div>
          <span id="timeDisplay" class="time-display">0:00 / 0:00</span>
          <button class="control-btn" onclick="toggleMute()">
            <span id="volumeIcon">&#128266;</span>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1" oninput="setVolume()" class="volume-slider">
          <button class="control-btn" onclick="prevVideo()">&#9664;&#9664;</button>
          <button class="control-btn" onclick="nextVideo()">&#9654;&#9654;</button>
          <button class="control-btn" onclick="toggleFit()" id="fitBtn" title="Toggle fit">&#x1F4F7;</button>
          <button class="control-btn" onclick="toggleFullscreen()" id="fullscreenBtn">&#x26F6;</button>
          <button class="control-btn" onclick="closeVideoModal()">&#10005;</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
