<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <title>Camera</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="180" />
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
  <link href="style.css?v=mobile_v3" rel="stylesheet" />
  <script type="text/javascript" src="mhelper.js"></script>
  <script type="text/javascript" src="script.js?v=mobile_v3"></script>

<body class="has-navbar-fixed-top" onload="recall()">
  <nav id="navigate" class="navbar is-fixed-top is-dark px-4" role="navigation" aria-label="main navigation"></nav>

  <section class="section media-container">
    <div class="container is-fluid">
      <div id="main" class="columns is-multiline is-centered is-variable is-1-mobile is-2-tablet"></div>
      <div id="timeline" class="mb-5"></div>
    </div>
  </section>

  <div id="pswinput" class="fpopup">
    <div class="contain">
      <div class="cloud">
        <h2 class="title is-4">Media Locked</h2>
      </div>
    </div>
    <div class="field has-addons is-justify-content-center mt-4">
      <div class="control">
        <input class="input is-medium is-rounded" type="password" placeholder="Enter password" id="psw" required
          autofocus onkeydown="return chkkey(event)" />
      </div>
    </div>
  </div>
</body>

</html>
